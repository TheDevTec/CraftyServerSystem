enabled: true

# When player dies
death:
  # Hide death message
  hide-death-message: false
  # This is global settings, you can also set per-player permission.
  # Permission: css.death.keep-inventory
  keep-inventory: false
  # This is global settings, you can also set per-player permission.
  # Permission: css.death.keep-exp
  keep-exp: false
  broadcast: []
  commands: []

# priorities:
# - home (with name "home" or first found)
# - bed
# - spawn (spawn set via /setspawn)
# - world (world's spawn location) - fallback if everything fails
respawn-priority:
- home
- bed
- spawn
- world