chat-placeholders:
  shrug:
    text: ":shrug:"
    replacement: '¯\_(ツ)_/¯'

antiSpam:
  enabled: true
  cache: 5min
  maximum-messages: 3
  # Maximum is 1.0
  minimal-similarity: 0.41
  random-letters:
    enabled: true
    # Minimum amount of letters in the message before this check can block it.
    minimum-length: 18
    # Only words at least this long are scored as random.
    minimum-word-length: 6
    # How many suspicious words must be found before blocking by ratio.
    minimum-suspicious-words: 2
    # 0.6 means 60% of checked long words must look random.
    minimum-suspicious-ratio: 0.6
    # Repeated 2-4 letter patterns this many times block immediately.
    repeated-sequence-threshold: 4
  cooldown-per-message:
    enabled: false
    time: 5s
    # css.chat.bypass.anticooldown
    bypass-enabled: false
  # css.chat.bypass.antispam
  bypass-enabled: false

antiFlood:
  enabled: true
  maximum-chars: 2
  # Maximum repeats of a 2-4 letter pattern (e.g. ahahahaha -> ahah)
  maximum-pattern-repeats: 2
  maximum-caps-chars: 3
  words-between-same-to-ignore: 6
  maximum-same-words-in-row: 2
  maximum-numbers: 12
  # css.chat.bypass.antiflood
  bypass-enabled: false

antiAd:
  enabled: true
  whitelist:
  - "example.com"
  # css.chat.bypass.antiad
  bypass-enabled: false

options:
  # types: GLOBAL, PER_WORLD, DISTANCE
  type: GLOBAL
  # If type is DISTANCE, distance is in blocks
  distance: 60
  # If type is PER_WORLD, create world groups in which players can write between:
  per_world:
    group0:
    - "world"
    - "trade_world"
    group1:
    - "world_nether"
    group2:
    - "world_the_end"
    # etc.

notification:
  color: "§e@" # RGB (#RRGGBB) or default vanilla color (§<colorChar>)
  sound:
    # https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Sound.html
    name: "ENTITY_PLAYER_LEVELUP"
    pitch: 1
    volume: 1
  # placeholders: %player% - target, {pinger} - Name of player who pinged target
  commands: []
  messages: []

translations:
  antiSwear: "{prefix} &eDon't be vulgar, there are kids among us!"
  antiSpam: "{prefix} &ePlease don't spam the chat."
  # {time}
  antiSpam-Cooldown: "{prefix} &ePlease don't spam the chat, wait {time} before sending another message."
  antiAd: "{prefix} &eAdvertising is forbidden here."
  # gh.chat.antiad
  antiAd-admin: "{prefix} &cPlayer &e{player} &cwas trying to post an ad: &e{message}"

formats:
  default:
    chat: "{player} &7» {message}"
    message: "&7{message}"
    name: "&7Player &f{player}"
  # Vault group name
  vip:
    chat: "{player} &7» {message}"
    message: "&a{message}"
    name: "&aVIP &e{player}"
  # If it's not "default" group & any other existing group in the "formats" section.. then it'll be used this format:
  __OTHER__:
    chat: ["", {"text":"{player} &7» "}, {"text":"{message}", "hoverEvent":{"action":"show_text", "value":"&aMessage sent at %server_time%"}}]
    message: "&f{message}"
    name: "%luckperms_prefix% {player}"
