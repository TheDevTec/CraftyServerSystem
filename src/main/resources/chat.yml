  # Format: languages|collision-languages|word.
  # These rules run language detection only when a matching candidate is found.
  # Example: "cs,sk|ro|pica" blocks Czech/Slovak profanity
  # but ignores the harmless Romanian word "pica". The lightweight detector returns
  # UNKNOWN for unclear messages, which are reviewed instead of blocked.
  language-rules:
  - "cs,sk|ro|pica"
  block-event: false
  # If block-event is false, direct and split vulgarisms are replaced.
  replacement: "****"
  # css.chat.bypass.antiswear
  bypass-enabled: false
  automod-debug:
    # Logs every matched rule for moderation tuning. Disable after reviewing the defaults.
    enabled: true
    # Also prints the same details to the server console.
    console: true
    # Online players with this permission receive the debug message.
    permission: "css.chat.automod.debug"
  history:
    enabled: true
    # Completed split words are blocked or replaced in the current message.
    # How long previous messages stay available for anti-swear checks.
    cache: 20s
    # Number of previous messages by the same player used with the current message.
    maximum-messages: 4
  language-profile:
    # Temporary per-player language profile. It is never saved to disk.
    cache: 30m
  # Phrases blocked only in context. One normal spelling is enough: diacritics,
  # spaces, dots, hyphens and basic leetspeak are normalized automatically.
  contextual-phrases:
  - "to duck you"
  - "duck you"
  - "ducking man"
  - "ducking clown"
  - "ducking dog"
  - "you ducking"
  - "ty jsi kokos"
