title: "&8Warps &7({page}/{totalPages})"

loop:
  value: warp

  item:

    B:
      action: PREVIOUS_PAGE

      available:
        type: LIME_STAINED_GLASS_PANE
        displayName: "&aPrevious page"
        lore:
        - ""
        - "&7Go to page &f{previousPage}"
        - ""

      unavailable:
        type: BLACK_STAINED_GLASS_PANE
        displayName: "&c"

    N:
      action: NEXT_PAGE

      available:
        type: LIME_STAINED_GLASS_PANE
        displayName: "&aNext page"
        lore:
        - ""
        - "&7Go to page &f{nextPage}"
        - ""

      unavailable:
        type: BLACK_STAINED_GLASS_PANE
        displayName: "&c"

    result:

      conditions:

        #
        # 0
        # Warp requires permission and player doesn't have it.
        #
        0:
          check:
          - "CHECK_PLACEHOLDER:{warp_requires_permission}==true"
          - "CHECK_PLACEHOLDER:{warp_has_permission}==false"

          type: "{warp_material}"
          displayName: "&c{warp}"

          lore:
          - ""
          - "&7World: &f{warp_world}"
          - "&7Permission: &c{warp_permission}"
          - ""
          - "&cYou don't have permission"
          - "&cto use this warp."
          - ""
          - "&7Click for more information."

          click:
            commands: []
            messages: []
            actions:
            - "warp"

        #
        # 1
        # Warp costs money and player can't afford it.
        #
        1:
          check:
          - "CHECK_PLACEHOLDER:{warp_has_cost}==true"
          - "CHECK_PLACEHOLDER:{warp_has_money}==false"

          type: "{warp_material}"
          displayName: "&c{warp}"

          lore:
          - ""
          - "&7World: &f{warp_world}"
          - "&7Cost: &c{warp_cost}"
          - ""
          - "&cYou don't have enough money."
          - ""
          - "&7Click for more information."

          click:
            commands: []
            messages: []
            actions:
            - "warp"

        #
        # 2
        # Permission + paid.
        #
        2:
          check:
          - "CHECK_PLACEHOLDER:{warp_requires_permission}==true"
          - "CHECK_PLACEHOLDER:{warp_has_cost}==true"

          type: "{warp_material}"
          displayName: "&a{warp}"

          lore:
          - ""
          - "&7World: &f{warp_world}"
          - "&7Cost: &f{warp_cost}"
          - "&7Permission: &f{warp_permission}"
          - ""
          - "&aClick to teleport"
          - ""

          click:
            commands: []
            messages: []
            actions:
            - "warp"

        #
        # 3
        # Permission + free.
        #
        3:
          check:
          - "CHECK_PLACEHOLDER:{warp_requires_permission}==true"

          type: "{warp_material}"
          displayName: "&a{warp}"

          lore:
          - ""
          - "&7World: &f{warp_world}"
          - "&7Permission: &f{warp_permission}"
          - ""
          - "&aClick to teleport"
          - ""

          click:
            commands: []
            messages: []
            actions:
            - "warp"

        #
        # 4
        # No permission requirement + paid.
        #
        4:
          check:
          - "CHECK_PLACEHOLDER:{warp_has_cost}==true"

          type: "{warp_material}"
          displayName: "&a{warp}"

          lore:
          - ""
          - "&7World: &f{warp_world}"
          - "&7Cost: &f{warp_cost}"
          - ""
          - "&aClick to teleport"
          - ""

          click:
            commands: []
            messages: []
            actions:
            - "warp"

      #
      # DEFAULT
      #
      # No permission requirement + free.
      #
      type: "{warp_material}"
      displayName: "&a{warp}"

      lore:
      - ""
      - "&7World: &f{warp_world}"
      - ""
      - "&aClick to teleport"
      - ""

      click:
        commands: []
        messages: []
        actions:
        - "warp"

lines:
- "xxxxxxxxx"
- "#########"
- "#########"
- "#########"
- "#########"
- "xBxxcxxNx"

items:

  x:
    type: BLACK_STAINED_GLASS_PANE
    displayName: "&c"

  c:
    type: RED_STAINED_GLASS_PANE
    displayName: "&cClose"

    lore:
    - ""
    - "&7Click to close menu!"
    - ""

    click:
      commands: []
      messages: []
      actions:
      - "CLOSE_MENU"